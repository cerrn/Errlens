# Render Blueprint: keep it at the repository root and connect it via "New → Blueprint" in the Render dashboard.
services:
  - type: web
    name: errlens-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ERRLENS_DB_PATH
        value: /data/errlens.db
    disk:
      name: errlens-data
      mountPath: /data
      sizeGB: 1
